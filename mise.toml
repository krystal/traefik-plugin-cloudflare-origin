[settings]
# mise.lock pins exact versions and checksums; [tools] pins majors only.
lockfile = true
# Skip tool releases younger than three days.
minimum_release_age = "3d"

[tools]
go = "1"
golangci-lint = "2"
actionlint = "1"
pinact = "5"
zizmor = "1"
lefthook = "2"
# Traefik and the Yaegi CLI are test targets. The e2e suite checks that the
# Yaegi CLI matches the Yaegi version built into the Traefik binary.
"aqua:traefik/yaegi" = "0"
"github:traefik/traefik" = "3"

[tasks.setup]
description = "Install tools and the lefthook git hooks"
run = ["mise install", "lefthook install"]

[tasks.format]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks."format:check"]
description = "Check Go formatting without changing files"
run = "golangci-lint fmt --diff"

[tasks."lint:go"]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks."lint:actions"]
description = "Check GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions workflows with zizmor, online when a GitHub token is set"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n "${GH_TOKEN:-${GITHUB_TOKEN:-}}" ]]; then
  zizmor .github
else
  zizmor --offline .github
fi
'''

[tasks."lint:pinact"]
description = "Check that GitHub Actions are SHA-pinned to releases at least three days old"
run = "pinact run --check --verify-comment --min-age 3"

[tasks."pin:actions"]
description = "Pin GitHub Actions to full commit SHAs"
run = "pinact run --min-age 3"

[tasks.lint]
description = "Run all linters"
depends = ["lint:go", "lint:actions", "lint:zizmor", "lint:pinact"]

[tasks.test]
description = "Run unit tests with the Go toolchain"
run = "go test -count=1 ./..."

[tasks."test:yaegi"]
description = "Run unit tests under the Yaegi interpreter Traefik embeds"
run = '''
#!/usr/bin/env bash
set -euo pipefail
import_path=github.com/krystal/traefik-plugin-cloudflare-origin
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
mkdir -p "$tmp/src/$import_path"
cp .traefik.yml go.mod cloudflare_origin.go cloudflare_origin_test.go "$tmp/src/$import_path/"
GOPATH="$tmp" GO111MODULE=off yaegi test -v "$import_path"
'''

[tasks.e2e]
description = "Run end-to-end tests against a real Traefik binary"
run = "go test -tags e2e -count=1 -v ./e2e/"

[tasks."e2e:canary"]
description = "Run end-to-end tests against the canary Traefik and Yaegi in mise.canary.toml"
run = "mise --env canary run e2e"

[tasks."canary:use"]
description = "Pin the canary to a Traefik release and its embedded Yaegi, and lock both"
usage = '''
arg "[version]" default="3" help="Traefik version or prefix; the default is the newest 3.x release outside the cooldown"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
# mise latest honours the cooldown, so it also rejects exact versions inside it.
version="$(mise latest "github:traefik/traefik@${usage_version#v}")"
if [[ -z "$version" ]]; then
  echo "no traefik release matches ${usage_version} outside the cooldown" >&2
  exit 1
fi
mise use --env canary "github:traefik/traefik@$version"
traefik="$(mise --env canary which traefik)"
yaegi="$(go version -m "$traefik" | awk '$2 == "github.com/traefik/yaegi" { sub(/^v/, "", $3); print $3 }')"
if [[ -z "$yaegi" ]]; then
  echo "traefik build info does not list github.com/traefik/yaegi" >&2
  exit 1
fi
mise use --env canary "aqua:traefik/yaegi@$yaegi"
mise --env canary lock --platform linux-x64,linux-arm64,macos-arm64
'''

[tasks.check]
description = "Run format checks, linters and unit tests under Go and Yaegi"
depends = ["format:check", "lint", "test", "test:yaegi"]
