[settings]
# mise.lock pins exact versions and checksums; [tools] pins majors only.
lockfile = true
# Skip tool releases younger than three days.
minimum_release_age = "3d"

[tools]
go = "1"
golangci-lint = "2"
actionlint = "1"
pinact = "5"
zizmor = "1"
lefthook = "2"
# Traefik and the Yaegi CLI are test targets. The e2e suite checks that the
# Yaegi CLI matches the Yaegi version built into the Traefik binary.
"aqua:traefik/yaegi" = "0"
"github:traefik/traefik" = "3"

[tasks.setup]
description = "Install tools and the lefthook git hooks"
run = ["mise install", "lefthook install"]

[tasks.format]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks."format:check"]
description = "Check Go formatting without changing files"
run = "golangci-lint fmt --diff"

[tasks."lint:go"]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks."lint:actions"]
description = "Check GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions workflows with zizmor, online when a GitHub token is set"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n "${GH_TOKEN:-${GITHUB_TOKEN:-}}" ]]; then
  zizmor .github
else
  zizmor --offline .github
fi
'''

[tasks."lint:pinact"]
description = "Check that GitHub Actions are SHA-pinned to releases at least three days old"
run = "pinact run --check --verify-comment --min-age 3"

[tasks."pin:actions"]
description = "Pin GitHub Actions to full commit SHAs"
run = "pinact run --min-age 3"

[tasks.lint]
description = "Run all linters"
depends = ["lint:go", "lint:actions", "lint:zizmor", "lint:pinact"]

[tasks.test]
description = "Run unit tests with the Go toolchain"
run = "go test -count=1 ./..."

[tasks."test:yaegi"]
description = "Run unit tests under the Yaegi interpreter Traefik embeds"
run = '''
#!/usr/bin/env bash
set -euo pipefail
import_path=github.com/krystal/traefik-plugin-cloudflare-origin
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
mkdir -p "$tmp/src/$import_path"
cp .traefik.yml go.mod cloudflare_origin.go cloudflare_origin_test.go "$tmp/src/$import_path/"
GOPATH="$tmp" GO111MODULE=off yaegi test -v "$import_path"
'''

[tasks.e2e]
description = "Run end-to-end tests against a real Traefik binary"
run = "go test -tags e2e -count=1 -v ./e2e/"

[tasks."e2e:canary"]
description = "Run end-to-end tests against the canary Traefik and Yaegi in mise.canary.toml"
run = "mise --env canary run e2e"

[tasks."image:test"]
description = "Build and check the container image for amd64 and arm64, and run it on the native platform"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=traefik-plugin-cloudflare-origin:image-test
plugin_files=(.traefik.yml go.mod cloudflare_origin.go)
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"; docker image rm "$tag" >/dev/null 2>&1 || true' EXIT

fail() {
  echo "image:test: $*" >&2
  exit 1
}

# Lists a directory's entries, one per line, in a locale-independent order.
entries() {
  (cd "$1" && find . -mindepth 1 | LC_ALL=C sort)
}

# One platform per build, because the docker driver with the classic image
# store cannot export or load a multi-platform image.
for platform in linux/amd64 linux/arm64; do
  arch="${platform#linux/}"
  out="$tmp/$arch"
  docker buildx build --platform "$platform" --output "type=local,dest=$out" .

  [[ "$(entries "$out")" == "$(printf './%s\n' "${plugin_files[@]}" LICENSE copy-plugin | LC_ALL=C sort)" ]] ||
    fail "$platform: unexpected image contents: $(entries "$out" | tr '\n' ' ')"
  for f in "${plugin_files[@]}" LICENSE; do
    cmp "$f" "$out/$f" || fail "$platform: $f differs from the repository"
    [[ -n "$(find "$out/$f" -perm 0644)" ]] || fail "$platform: $f mode is not 0644"
  done
  [[ -n "$(find "$out/copy-plugin" -perm 0755)" ]] || fail "$platform: copy-plugin mode is not 0755"
  buildinfo="$(go version -m "$out/copy-plugin")"
  [[ "$buildinfo"$'\n' == *$'\tGOARCH='"$arch"$'\n'* ]] || fail "$platform: copy-plugin is not built for $arch"
done

# mise renders run scripts as Tera templates, so raw blocks protect the Go
# templates that docker's --format takes.
native="$(docker version --format '{% raw %}{{.Server.Os}}/{{.Server.Arch}}{% endraw %}')"
case "$native" in
  linux/amd64 | linux/arm64) ;;
  *) fail "unsupported Docker server platform $native" ;;
esac
docker buildx build --platform "$native" --load --tag "$tag" .

user="$(docker image inspect --format '{% raw %}{{.Config.User}}{% endraw %}' "$tag")"
[[ "$user" == 65532:65532 ]] || fail "image user is ${user:-empty}, want 65532:65532"

# A 0777 directory stands in for an emptyDir that the pod user can write to.
dest="$tmp/dest"
mkdir -m 0777 "$dest"
docker run --rm --read-only --network none --volume "$dest:/destination" "$tag" /destination
[[ "$(entries "$dest")" == "$(printf './%s\n' "${plugin_files[@]}" | LC_ALL=C sort)" ]] ||
  fail "unexpected copied files: $(entries "$dest" | tr '\n' ' ')"
for f in "${plugin_files[@]}"; do
  cmp "$f" "$dest/$f" || fail "copied $f differs from the repository"
done
[[ -z "$(find "$dest" -mindepth 1 ! -user 65532)" ]] || fail "copied files are not owned by uid 65532"

if docker run --rm --read-only --network none "$tag" /missing; then
  fail "copy-plugin succeeded with a missing destination"
fi
echo "image:test: ok"
'''

[tasks."canary:use"]
description = "Pin the canary to a Traefik release and its embedded Yaegi, and lock both"
usage = '''
arg "[version]" default="3" help="Traefik version or prefix; the default is the newest 3.x release outside the cooldown"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
# mise latest honours the cooldown, so it also rejects exact versions inside it.
version="$(mise latest "github:traefik/traefik@${usage_version#v}")"
if [[ -z "$version" ]]; then
  echo "no traefik release matches ${usage_version} outside the cooldown" >&2
  exit 1
fi
mise use --env canary "github:traefik/traefik@$version"
traefik="$(mise --env canary which traefik)"
yaegi="$(go version -m "$traefik" | awk '$2 == "github.com/traefik/yaegi" { sub(/^v/, "", $3); print $3 }')"
if [[ -z "$yaegi" ]]; then
  echo "traefik build info does not list github.com/traefik/yaegi" >&2
  exit 1
fi
mise use --env canary "aqua:traefik/yaegi@$yaegi"
mise --env canary lock --platform linux-x64,linux-arm64,macos-arm64
'''

[tasks.check]
description = "Run format checks, linters and unit tests under Go and Yaegi"
depends = ["format:check", "lint", "test", "test:yaegi"]
