rules:
  dependabot-cooldown:
    config:
      # Project policy is a three-day cooldown for every dependency source.
      days: 3
  cache-poisoning:
    ignore:
      # ci.yml publishes nothing: the image job builds a throwaway test image,
      # and the release-please job only tags the tested commit. image.yml
      # builds the release image from the tag without caches, so a poisoned
      # tool cache cannot reach a release. Revisit if ci.yml ever publishes or
      # uploads artifacts.
      - ci.yml
