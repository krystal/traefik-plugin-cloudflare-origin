name: Container image

# Publishes each release as a multi-arch image on GHCR, with a build
# provenance attestation. It restores and saves no caches, so nothing built or
# downloaded by another workflow can reach the published image.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}

jobs:
  publish:
    name: Publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push the image to GHCR.
      id-token: write # Get the Sigstore certificate that signs the attestation.
      attestations: write # Store the attestation.
    env:
      IMAGE: ghcr.io/krystal/traefik-plugin-cloudflare-origin
    steps:
      # Exact vX.Y.Z tags only: the docs pin images by tag and digest, and no
      # floating tags are published.
      - name: Check the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag $TAG is not of the form vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          # Dependabot does not update this image. To bump it, pick a
          # moby/buildkit release at least three days old and replace the tag
          # and the digest from
          # `docker buildx imagetools inspect moby/buildkit:<tag>`.
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          provenance: false
          sbom: false
          annotations: |
            index:org.opencontainers.image.source=https://github.com/krystal/traefik-plugin-cloudflare-origin
            index:org.opencontainers.image.description=Traefik plugin that authenticates Cloudflare-proxied requests and forwards their real client IP
            index:org.opencontainers.image.licenses=MIT
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # A storage record needs the artifact-metadata permission, which
          # this job does not request.
          create-storage-record: false
