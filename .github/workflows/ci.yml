name: CI

on:
  push:
    branches: [main, "release-*.x"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Install exactly what mise.lock records.
  MISE_LOCKED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run lint
        env:
          # pinact and zizmor's online audits query the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}

  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run test

  test-yaegi:
    name: Unit tests (Yaegi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run test:yaegi

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run e2e

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [lint, format, test, test-yaegi, e2e]
    # Keeps pull request and feature-branch runs out of the release
    # environment. This is only a filter: anyone who can push a branch can
    # edit it, so the environment's deployment branch policy is what
    # restricts access to the App key.
    if: >-
      github.event_name == 'push' && (
        github.ref_name == 'main' || (
          startsWith(github.ref_name, 'release-') &&
          endsWith(github.ref_name, '.x')
        )
      )
    environment: release
    # The GitHub App token does the writing; the job token needs nothing.
    permissions: {}
    steps:
      - uses: krystal/release-please-manifest-action@40085023b8f3a14a9f33cbc3c5d994b5083500eb # v4.0.0
        with:
          target-branch-pattern: '^(main|release-[0-9]+(\.[0-9]+)?\.x)$'
          client-id: ${{ vars.RELEASE_PLEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_PRIVATE_KEY }}
