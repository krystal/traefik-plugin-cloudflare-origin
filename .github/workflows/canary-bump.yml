name: Traefik canary bump

# Moves the canary to the newest Traefik 3.x release outside the cooldown and
# opens a pull request, where canary.yml tests it. This workflow only proposes
# the change: the canary itself keeps read-only permissions.
on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  bump:
    name: Bump the Traefik canary
    runs-on: ubuntu-latest
    # The release environment holds the GitHub App credentials, and its
    # deployment branch policy limits them to main and release-*.x.
    if: github.ref == 'refs/heads/main'
    environment: release
    # The GitHub App token does the writing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
          # This job holds write credentials, so it never restores a cache.
          cache: false
      # Later steps in this job hold write credentials, so this step must not
      # execute the Traefik or Yaegi binaries it downloads. canary:use only
      # reads Traefik's build info.
      - name: Select the canary version
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          previous="$(mise --env canary current github:traefik/traefik)"
          mise run canary:use
          version="$(mise --env canary current github:traefik/traefik)"
          yaegi="$(mise --env canary current aqua:traefik/yaegi)"
          newest="$(printf '%s\n' "$previous" "$version" | sort -V | tail -n 1)"
          {
            echo "previous=$previous"
            echo "version=$version"
            echo "yaegi=$yaegi"
            # Only move forward, so a canary moved past the cooldown by hand
            # is never proposed for a downgrade.
            if [[ "$version" != "$previous" && "$newest" == "$version" ]]; then
              echo "changed=true"
            else
              echo "changed=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Canary: Traefik $previous -> $version, Yaegi $yaegi" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the App token
        if: steps.select.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # sign-commits makes the commit through the GitHub API, so GitHub signs
      # it as the App; the repository requires signed commits on every branch.
      # Each run resets the branch to its own commit, discarding others.
      - name: Open or update the pull request
        if: steps.select.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: main
          branch: canary/traefik-bump
          add-paths: |
            mise.canary.toml
            mise.canary.lock
          commit-message: "ci: move the Traefik canary to v${{ steps.select.outputs.version }}"
          title: "ci: move the Traefik canary to v${{ steps.select.outputs.version }}"
          body: |
            Moves the Traefik compatibility canary from v${{ steps.select.outputs.previous }} to v${{ steps.select.outputs.version }}, the newest Traefik 3.x release outside the three-day cooldown, with the Yaegi CLI it embeds (v${{ steps.select.outputs.yaegi }}). `mise run canary:use` produced `mise.canary.toml` and `mise.canary.lock`.

            The `Traefik canary` workflow runs the full e2e suite against this version on this pull request. Merging only moves the canary; the supported baseline in `mise.lock` is unchanged.

            The `Traefik canary bump` workflow owns this branch and replaces its commits on each run, so make any fixes in a separate pull request.
