# Traefik compatibility canary, loaded with MISE_ENV=canary on top of
# mise.toml. mise.canary.lock pins these versions and their checksums.
# Change them with `mise run canary:use [version]`, not by hand: the Yaegi CLI
# must match the Yaegi version built into this Traefik binary.
[tools]
"aqua:traefik/yaegi" = "0.16.1"
"github:traefik/traefik" = "3.7.15"
